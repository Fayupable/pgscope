name: Frontend CI

on:
  push:
    branches: [main, 'dev/**']
    paths:
      - 'web/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, 'dev/**']
    paths:
      - 'web/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run lint:css